<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naina</title>
    <style>
        body { font-family: sans-serif; background: #ece5dd; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; }
        .bubble { max-width: 75%; padding: 10px 15px; border-radius: 15px; margin-bottom: 10px; font-size: 16px; line-height: 1.4; }
        .user { align-self: flex-end; background: #dcf8c6; }
        .naina { align-self: flex-start; background: #ffffff; }
        #input-area { padding: 15px; background: #f0f0f0; display: flex; }
        input { flex: 1; padding: 12px; border: none; border-radius: 20px; outline: none; }
        button { margin-left: 10px; padding: 10px 20px; background: #128c7e; color: white; border: none; border-radius: 20px; cursor: pointer; }
        #typing { font-size: 12px; color: #888; margin-left: 20px; display: none; }
    </style>
</head>
<body>

<div id="chat-window">
    <div class="bubble naina">Hi! Main Naina, Delhi se. Aapka naam? 😊</div>
</div>
<div id="typing">Naina is typing...</div>
<div id="input-area">
    <input type="text" id="msgInput" placeholder="Message Naina...">
    <button onclick="send()">Send</button>
</div>

<script>
    async function send() {
        const input = document.getElementById('msgInput');
        const chatWindow = document.getElementById('chat-window');
        const typing = document.getElementById('typing');
        const msg = input.value;
        if (!msg) return;

        // Add user msg to UI
        chatWindow.innerHTML += `<div class="bubble user">${msg}</div>`;
        input.value = '';
        typing.style.display = 'block';
        chatWindow.scrollTop = chatWindow.scrollHeight;

        // Send to Server
        try {
            const response = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: msg, userIp: 'USER_IP_HERE' }) 
            });
            const data = await response.json();
            
            typing.style.display = 'none';
            chatWindow.innerHTML += `<div class="bubble naina">${data.reply.replace(/\n/g, '<br>')}</div>`;
            chatWindow.scrollTop = chatWindow.scrollHeight;
        } catch (e) {
            typing.style.display = 'none';
            chatWindow.innerHTML += `<div class="bubble naina">Yaar, thodi der mein baat karu? Mummy bula rahi hai.</div>`;
        }
    }
</script>
</body>
</html>
