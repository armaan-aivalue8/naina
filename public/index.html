<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background-color: #0b141a; color: #e9edef; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #chat { flex: 1; padding: 15px; overflow-y: auto; }
        .naina { background: #202c33; padding: 10px; border-radius: 8px; margin: 10px 0; max-width: 80%; align-self: flex-start; }
        .user { background: #005c4b; padding: 10px; border-radius: 8px; margin: 10px 0; max-width: 80%; margin-left: auto; text-align: right; }
        .input-area { background: #202c33; padding: 10px; display: flex; position: sticky; bottom: 0; }
        input { flex: 1; padding: 10px; background: #2a3942; border: none; border-radius: 20px; color: white; outline: none; }
        button { background: #00a884; color: white; border: none; padding: 10px 20px; border-radius: 20px; margin-left: 5px; }
    </style>
</head>
<body>
    <div id="chat"></div>
    <div class="input-area">
        <input type="text" id="inp" placeholder="Message Naina...">
        <button onclick="send()">Send</button>
    </div>
<script>
async function send() {
    const inp = document.getElementById('inp');
    const msg = inp.value;
    if(!msg) return;
    document.getElementById('chat').innerHTML += '<div class="user">'+msg+'</div>';
    inp.value = '';
    const res = await fetch('/chat', { 
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ message: msg, userIp: 'USER_IP' })
    });
    const data = await res.json();
    let reply = data.reply;
    if(reply.includes('[SHOW_QR]')) {
        reply = reply.replace('[SHOW_QR]','');
        document.getElementById('chat').innerHTML += '<div class="naina">Recharge 30rs: <img src="https://api.qrserver.com/v1/create-qr-code/?data=upi://pay?pa=Q57363994@ybl&am=30" width="100"><br><input id="utr" placeholder="UTR..."><button onclick="submitUTR()">Submit</button></div>';
    }
    document.getElementById('chat').innerHTML += '<div class="naina">'+reply+'</div>';
}
async function submitUTR() {
    const utr = document.getElementById('utr').value;
    await fetch('/submit-utr', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ utr: utr, ip: 'USER_IP' })
    });
    alert("Bheja gaya!");
}
</script>
</body>
</html>
