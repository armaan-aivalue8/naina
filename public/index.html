<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; background: #ece5dd; margin: 0; padding: 10px; }
        #chat { height: 80vh; overflow-y: auto; }
        .naina { background: white; padding: 10px; margin: 5px; border-radius: 10px; }
        .user { background: #dcf8c6; padding: 10px; margin: 5px; border-radius: 10px; text-align: right; }
    </style>
</head>
<body>
    <div id="chat"></div>
    <div style="position:fixed; bottom:0; width:95%; padding:10px;">
        <input type="text" id="inp" placeholder="Type..." style="width:70%; padding:10px;">
        <button onclick="send()">Send</button>
    </div>

<script>
async function send() {
    const inp = document.getElementById('inp');
    const msg = inp.value;
    document.getElementById('chat').innerHTML += `<div class="user">${msg}</div>`;
    inp.value = '';

    const res = await fetch('/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ message: msg, userIp: 'USER_IP_FROM_SERVER' })
    });
    const data = await res.json();
    
    let reply = data.reply;
    if (reply.includes('[SHOW_QR]')) {
        reply = reply.replace('[SHOW_QR]', '');
        document.getElementById('chat').innerHTML += `
            <div class="naina">
                Yaar, 30rs ka recharge kar do, phir unlimited baatein karenge!<br>
                <img src="https://api.qrserver.com/v1/create-qr-code/?data=upi://pay?pa=Q57363994@ybl&pn=Naina&am=30.00&cu=INR" width="200"><br>
                <input type="text" id="utr" placeholder="Enter UTR here...">
                <button onclick="submitUTR()">Submit UTR</button>
            </div>`;
    }
    document.getElementById('chat').innerHTML += `<div class="naina">${reply}</div>`;
}

async function submitUTR() {
    const utr = document.getElementById('utr').value;
    alert("UTR: " + utr + " bheja gaya. Check kar rahi hoon!");
    // Yahan backend ko UTR bhejenge
}
</script>
</body>
</html>
