<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; }
        body { background: #0b141a; color: #e9edef; font-family: sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #header { background: #202c33; padding: 12px 15px; display: flex; align-items: center; border-bottom: 1px solid #333; height: 60px; flex-shrink: 0; }
        .dp { width: 40px; height: 40px; border-radius: 50%; background: #ff4d4d; margin-right: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        #chat { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; }
        .naina { background: #202c33; padding: 10px 15px; border-radius: 8px; margin: 5px 0; max-width: 85%; align-self: flex-start; }
        .user { background: #005c4b; padding: 10px 15px; border-radius: 8px; margin: 5px 0; max-width: 85%; align-self: flex-end; margin-left: auto; }
        .input-box { background: #202c33; padding: 10px; display: flex; flex-shrink: 0; }
        input { flex: 1; padding: 12px; background: #2a3942; border: none; border-radius: 25px; color: white; outline: none; margin-right: 8px; }
        button { background: #00a884; color: white; border: none; padding: 0 20px; border-radius: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="header"><div class="dp">❤️</div> <b>Naina</b></div>
    <div id="chat"></div>
    <div class="input-box">
        <input type="text" id="inp" placeholder="Type a message...">
        <button onclick="send()">Send</button>
    </div>
<script>
async function send() {
    const inp = document.getElementById('inp');
    if(!inp.value) return;
    document.getElementById('chat').innerHTML += '<div class="user">'+inp.value+'</div>';
    const msg = inp.value; inp.value = '';
    document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
    
    try {
        const res = await fetch('/chat', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ message: msg, userIp: '127.0.0.1' }) });
        const data = await res.json();
        let reply = data.reply;
        document.getElementById('chat').innerHTML += '<div class="naina">'+reply+'</div>';
        document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
    } catch(e) { document.getElementById('chat').innerHTML += '<div class="naina">Server busy...</div>'; }
}
</script></body></html>
