<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; }
        body { background: #0b141a; color: #e9edef; font-family: sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #header { background: #202c33; padding: 10px 15px; display: flex; align-items: center; border-bottom: 1px solid #333; position: sticky; top: 0; }
        .dp { width: 45px; height: 45px; border-radius: 50%; margin-right: 12px; border: 2px solid #00a884; object-fit: cover; }
        #chat { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; background: #0b141a; }
        .naina { background: #202c33; padding: 12px; border-radius: 0 15px 15px 15px; margin: 5px 0; max-width: 85%; align-self: flex-start; box-shadow: 0 1px 1px #000; }
        .user { background: #005c4b; padding: 12px; border-radius: 15px 0 15px 15px; margin: 5px 0; max-width: 85%; align-self: flex-end; margin-left: auto; color: white; }
        .input-box { background: #202c33; padding: 10px; display: flex; align-items: center; }
        input { flex: 1; padding: 14px; background: #2a3942; border: none; border-radius: 25px; color: white; outline: none; margin-right: 8px; }
        button { background: #00a884; color: white; border: none; padding: 12px 22px; border-radius: 50%; font-weight: bold; }
    </style>
</head>
<body>
    <div id="header">
        <img src="https://i.imgur.com/8Km6a8m.png" class="dp" alt="Naina">
        <div>Naina<br><small style="color:#8696a0; font-size:12px;">online</small></div>
    </div>
    <div id="chat"></div>
    <div class="input-box">
        <input type="text" id="inp" placeholder="Type a message...">
        <button onclick="send()">➤</button>
    </div>
<script>
async function send() {
    const inp = document.getElementById('inp');
    if(!inp.value) return;
    document.getElementById('chat').innerHTML += '<div class="user">'+inp.value+'</div>';
    const msg = inp.value; inp.value = '';
    document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
    
    try {
        const res = await fetch('/chat', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ message: msg, userIp: '127.0.0.1' }) });
        const data = await res.json();
        let reply = data.reply;
        if(reply.includes('[SHOW_QR]')) {
            reply = reply.replace('[SHOW_QR]','');
            document.getElementById('chat').innerHTML += '<div class="naina">Recharge 30rs:<br><img src="https://api.qrserver.com/v1/create-qr-code/?data=upi://pay?pa=Q57363994@ybl&am=30" width="120"><br><input id="utr" placeholder="Enter UTR..."><button onclick="submitUTR()" style="border-radius:5px; margin-top:5px;">Submit</button></div>';
        }
        document.getElementById('chat').innerHTML += '<div class="naina">'+reply+'</div>';
        document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
    } catch(e) { document.getElementById('chat').innerHTML += '<div class="naina">Server busy...</div>'; }
}
async function submitUTR() {
    const utr = document.getElementById('utr').value;
    await fetch('/submit-utr', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ utr: utr, ip: '127.0.0.1' }) });
    alert("UTR Received!");
}
</script></body></html>
