<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #0b141a; color: #e9edef; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #header { background: #202c33; padding: 10px; display: flex; align-items: center; border-bottom: 1px solid #333; }
        .dp { width: 40px; height: 40px; border-radius: 50%; background: #ff4d4d; margin-right: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        #chat { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; }
        .naina { background: #202c33; padding: 10px; border-radius: 8px; margin: 5px 0; max-width: 80%; align-self: flex-start; }
        .user { background: #005c4b; padding: 10px; border-radius: 8px; margin: 5px 0; max-width: 80%; align-self: flex-end; }
        .input-area { background: #202c33; padding: 10px; display: flex; }
        input { flex: 1; padding: 12px; background: #2a3942; border: none; border-radius: 20px; color: white; outline: none; }
        button { background: #00a884; color: white; border: none; padding: 10px 20px; border-radius: 20px; margin-left: 5px; }
    </style>
</head>
<body>
    <div id="header"><div class="dp">❤️</div> Naina</div>
    <div id="chat"></div>
    <div class="input-area">
        <input type="text" id="inp" placeholder="Message Naina...">
        <button onclick="send()">Send</button>
    </div>
<script>
async function send() {
    const inp = document.getElementById('inp');
    if(!inp.value) return;
    document.getElementById('chat').innerHTML += '<div class="user">'+inp.value+'</div>';
    const msg = inp.value; inp.value = '';
    const res = await fetch('/chat', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ message: msg, userIp: '127.0.0.1' }) });
    const data = await res.json();
    document.getElementById('chat').innerHTML += '<div class="naina">'+data.reply+'</div>';
    document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
}
</script></body></html>
